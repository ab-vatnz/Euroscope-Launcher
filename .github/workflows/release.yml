name: Release EuroScope Launcher

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Publish launcher
        run: dotnet publish src/EuroScopeLauncher/EuroScopeLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Build installer
        run: iscc installer/EuroScopeLauncher.iss
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/EuroScopeLauncher-Setup.exe
